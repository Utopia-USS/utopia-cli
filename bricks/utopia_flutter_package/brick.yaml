name: utopia_flutter_package
description: A minimal Flutter package scaffold (library, no app shell) with Utopia lints pre-wired.
version: 0.2.0
repository: https://github.com/Utopia-USS/utopia-cli/tree/main/bricks/utopia_flutter_package

environment:
  mason: ">=0.1.0-dev.50 <0.2.0"

vars:
  project_name:
    type: string
    description: Dart package name (snake_case).
    prompt: What is the package name?
    default: my_package
  package_name:
    type: string
    description: Same as project_name.
    default: my_package
  description:
    type: string
    description: Short package description.
    default: A Utopia Flutter package.
  skills_enabled:
    type: boolean
    description: Whether to generate the .claude/ skills marketplace config.
    default: true
  year:
    type: string
    default: "2026"
